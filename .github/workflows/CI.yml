name: CI
'on':
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish all platform packages and the root package to npm
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: python -m pip install ninja
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, flags: '', test: true }
          - { os: windows-latest, target: i686-pc-windows-msvc, flags: '', nodeArch: x86, test: true }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, flags: '', test: true }
          - { os: macos-15, target: aarch64-apple-darwin, flags: '', test: true }
          - { os: macos-15-intel, target: x86_64-apple-darwin, flags: '', test: true }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, flags: '', test: true }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, flags: '-x' }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, flags: '', test: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, flags: '-x' }
          - { os: ubuntu-latest, target: armv7-unknown-linux-gnueabihf, flags: '--use-napi-cross' }
          - { os: ubuntu-latest, target: aarch64-linux-android, flags: '' }
          - { os: ubuntu-latest, target: armv7-linux-androideabi, flags: '' }
          - { os: ubuntu-24.04, target: riscv64gc-unknown-linux-gnu, flags: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          architecture: ${{ matrix.nodeArch }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: android-actions/setup-android@v3
        if: contains(matrix.target, 'android')
        with:
          packages: 'ndk;26.2.11394342'
      - name: Configure Android NDK
        if: contains(matrix.target, 'android')
        shell: bash
        run: |
          ndk="$ANDROID_SDK_ROOT/ndk/26.2.11394342"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "ANDROID_NDK_LATEST_HOME=$ndk"
            echo "ANDROID_PLATFORM=android-24"
          } >> "$GITHUB_ENV"
      - name: Install RISC-V cross compiler
        if: matrix.target == 'riscv64gc-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
      - uses: mlugg/setup-zig@v2
        if: matrix.flags == '-x'
        with:
          version: 0.14.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: python -m pip install ninja
      - run: npm ci
      - run: npm run build -- --target ${{ matrix.target }} ${{ matrix.flags }}
      - run: npm test
        if: matrix.test
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: '*.node'
          if-no-files-found: error
  build-freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and test on FreeBSD
        uses: cross-platform-actions/action@v1.7.0
        with:
          operating_system: freebsd
          version: '15.0'
          memory: 8G
          cpu_count: 3
          shell: bash
          run: |
            set -e
            sudo pkg install -y curl node libnghttp2 npm cmake ninja
            curl --fail --silent --show-error https://sh.rustup.rs --output /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable
            source "$HOME/.cargo/env"
            npm ci
            npm run build -- --target x86_64-unknown-freebsd
            npm test
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-x86_64-unknown-freebsd
          path: '*.freebsd-x64.node'
          if-no-files-found: error
  test-node:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .
      - run: npm test
  package:
    needs: [check, build, build-freebsd, test-node]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: artifacts
      - run: npm run release:prepare
      - run: npm run release:check
      - run: npm test
      - name: Pack npm release
        shell: bash
        run: |
          mkdir -p release
          for package in npm/*/; do
            npm pack "./$package" --ignore-scripts --pack-destination release
          done
          npm pack --pack-destination release
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release
          path: release/*.tgz
          if-no-files-found: error
      - name: Publish platform packages
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: npm exec -- napi prepublish -t npm --no-gh-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Publish root package
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

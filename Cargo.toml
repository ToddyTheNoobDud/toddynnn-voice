[package]
edition = "2024"
rust-version = "1.88"
name = "toddynnn-voice"
version = "2.0.0"
license = "MIT"
repository = "https://github.com/ToddyTheNoobDud/toddynnn-voice"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "=3.16.1"
napi-derive = "=3.7.0"
opusic-sys = "=0.7.7"
symphonia = { version = "=0.6.1", features = ["all"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
